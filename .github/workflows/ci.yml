name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Install, migrate, test, lint, type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # Real install (uv sync = editable install of this project), not the
      # ad-hoc "run pytest from a raw checkout without installing" mode.
      # This is the condition that actually exposed the dual-import /
      # dual-engine bug (see ARCHITECTURE.md, SECURITY.md): the app's
      # compatibility import shim only diverged into two separate module
      # identities once the package was genuinely installed. Running CI
      # against an uninstalled checkout would never have caught it.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run test suite
        run: uv run pytest tests/ -v

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Type-check (mypy)
        run: uv run mypy src/
